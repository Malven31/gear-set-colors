# Packages the addon on every push to main and every tag, and uploads it to CurseForge only for a pushed
# tag (scripts/release.ps1 makes the tag). A tag containing "beta" or "alpha" is uploaded as a beta or alpha
# file, any other tag as a release.
#
# Any other run is a dry run: a push to main, or a run started by hand (Actions tab > Package > Run
# workflow). It checks the CurseForge token, builds the zip, checks its contents and attaches it to the
# run, without uploading anything.
#
# Needs the repository secret CF_API_TOKEN: a CurseForge API token from
# https://authors.curseforge.com/#/settings/api-tokens
name: Package

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with its full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The changelog of the CurseForge file: this version's CHANGELOG.md section only (the newest one on
      # a dry run). Fails when the section is missing or empty.
      - name: Write this version's changelog
        run: bash scripts/release-notes.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      # The packager uploads to the project named by "## X-Curse-Project-ID:" in the TOC, and without one
      # it skips the upload without a word, so a tag would end green with nothing uploaded. A tag fails here
      # instead; a dry run only warns.
      - name: Check the CurseForge project ID
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          id=$(tr -d '\r' < GearSetColors/GearSetColors.toc | sed -n 's/^## X-Curse-Project-ID:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p')
          if [ -n "$id" ]; then
            echo "CurseForge project ID: $id"
          elif [ "$REF_TYPE" = "tag" ]; then
            echo "::error::GearSetColors/GearSetColors.toc has no '## X-Curse-Project-ID: <id>' line, so nothing could be uploaded. Add the project's ID and tag again."
            exit 1
          else
            echo "::warning::GearSetColors/GearSetColors.toc has no '## X-Curse-Project-ID: <id>' line yet. A tag will fail until it has one."
          fi

      # Without a valid token the packager skips the upload, or fails late. This makes the same first
      # request as the packager (CurseForge's list of game versions), which uploads nothing: 200 means
      # the token is accepted, 401 that it is missing, 403 that it is wrong or revoked.
      - name: Check the CurseForge token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::The CF_API_TOKEN secret is missing, so nothing could be uploaded to CurseForge. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          versions="$RUNNER_TEMP/cf-versions.json"
          status=$(curl -s -o "$versions" -w "%{http_code}" -H "x-api-token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/wow/versions)
          if [ "$status" != "200" ]; then
            echo "::error::CurseForge refused the CF_API_TOKEN secret (HTTP $status). Create a new token at https://authors.curseforge.com/#/settings/api-tokens and replace the secret."
            exit 1
          fi
          echo "CurseForge accepts the token."
          # Interface 16001 is the game version Forever 1.60.1 (game version type 88568).
          if jq -e 'any(.[]; .gameVersionTypeID == 88568 and .name == "1.60.1")' "$versions" > /dev/null; then
            echo "CurseForge lists the game version Forever 1.60.1."
          else
            echo "::warning::CurseForge doesn't list the game version Forever 1.60.1. The packager will pick the closest Forever version."
          fi

      # -n "<zip name>:<CurseForge display name>": both "GearSetColors-<version>".
      - name: Package and upload to CurseForge
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        with:
          args: -n "GearSetColors-{project-version}:GearSetColors-{project-version}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Package only (dry run, nothing is uploaded)
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -n "GearSetColors-{project-version}:GearSetColors-{project-version}"

      # What players get: GearSetColors/ alone at the root of the zip, with its TOC, its Lua files, its icon
      # and the licence, and none of the repository's own files (docs, curseforge/, scripts/, dotfiles).
      # A push to main whose commit already carries a tag (release.ps1 -Push sends both) makes no zip: the
      # packager prints 'Found future tag "<tag>", not packaging.' and leaves the build to the tag's own run.
      - name: Check the zip's contents
        id: zip
        run: |
          if ! ls .release/*.zip > /dev/null 2>&1; then
            tag=$(git tag --points-at HEAD | paste -sd' ')
            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ -n "$tag" ]; then
              echo "::notice::No zip: this commit carries the tag $tag, so the packager left the build to that tag's own run."
              echo "built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The packager made no zip in .release/."
            exit 1
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          zip=$(ls .release/*.zip)
          listing="$RUNNER_TEMP/zip-files.txt"
          unzip -Z1 "$zip" | sort > "$listing"
          echo "$(basename "$zip"): $(grep -vc '/$' "$listing") files"
          roots=$(cut -d/ -f1 "$listing" | sort -u | paste -sd' ')
          if [ "$roots" != "GearSetColors" ]; then
            echo "::error::The zip's root holds \"$roots\" instead of exactly GearSetColors."
            exit 1
          fi
          for file in GearSetColors/GearSetColors.toc GearSetColors/Core.lua GearSetColors/Options.lua GearSetColors/EquipmentManager.lua GearSetColors/media/icon.tga GearSetColors/LICENSE; do
            if ! grep -qx "$file" "$listing"; then
              echo "::error::$file is missing from the zip."
              exit 1
            fi
          done
          if grep -E '(^|/)\.|^GearSetColors/(GearSetColors/|README\.md|FEATURES\.md|CHANGELOG\.md|RELEASE_NOTES\.md|curseforge/|scripts/)' "$listing"; then
            echo "::error::The zip holds repository files that players shouldn't get (listed above). Add them to the ignore list in .pkgmeta."
            exit 1
          fi
          echo "The zip holds only GearSetColors/, with its TOC, Lua files, icon and the licence."

      - name: Attach the zip to the run
        if: steps.zip.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          # .release starts with a dot, and upload-artifact skips hidden files by default since v4.4.
          include-hidden-files: true
          if-no-files-found: error
